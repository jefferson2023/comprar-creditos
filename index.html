<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pagamento via Pix - Recarga de Créditos</title>
    <!-- Fonte Moderna: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 31, 51, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #00e676;
            --primary-hover: #00c853;
            --primary-glow: rgba(0, 230, 118, 0.25);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 230, 118, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 16px 14px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            margin-top: 5px;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 2px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .badge-pix {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 230, 118, 0.1);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 6px;
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            width: 100%;
            color: var(--text-main);
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .option-btn.active {
            background: rgba(0, 230, 118, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .option-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .option-title {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .option-desc {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .radio-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            transition: var(--transition);
            position: relative;
            flex-shrink: 0;
        }

        .option-btn.active .radio-indicator {
            border-color: var(--primary);
            background: var(--primary);
        }

        .option-btn.active .radio-indicator::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 5px;
            height: 5px;
            background: var(--bg-color);
            border-radius: 50%;
        }

        .payment-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 12px;
            border: 1px solid var(--card-border);
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .payment-box.active {
            display: flex;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 8px;
            border-radius: var(--radius-md);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .pix-code-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pix-code-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .pix-code-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px;
            color: var(--text-muted);
            font-size: 0.75rem;
            outline: none;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            text-align: center;
        }

        .btn-copy {
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 16px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .btn-copy:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-copy.copied {
            background: var(--accent);
            color: #fff;
        }

        .instructions {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="badge-pix">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                PAGAMENTO AUTOMÁTICO
            </div>
            <h1>Recarga de Créditos</h1>
            <p>Selecione a opção desejada para gerar o Pix</p>
        </div>

        <!-- Opções -->
        <div class="options-grid">
            <button class="option-btn" onclick="selecionarFaixa('ate149', this)">
                <div class="option-info">
                    <span class="option-title">P2Cine TV (Até R$ 149,00)</span>
                    <span class="option-desc">Recargas até R$ 149,00</span>
                </div>
                <div class="radio-indicator"></div>
            </button>

            <button class="option-btn" onclick="selecionarFaixa('150mais', this)">
                <div class="option-info">
                    <span class="option-title">P2Cine TV (R$ 150,00 ou +)</span>
                    <span class="option-desc">Para valores a partir de R$ 150,00</span>
                </div>
                <div class="radio-indicator"></div>
            </button>

            <button class="option-btn" onclick="selecionarFaixa('outrosServidores', this)">
                <div class="option-info">
                    <span class="option-title">OUTROS SERVIDORES</span>
                    <span class="option-desc">Recarga para demais servidores</span>
                </div>
                <div class="radio-indicator"></div>
            </button>
        </div>

        <!-- Área do QR Code e Copia e Cola -->
        <div class="payment-box" id="paymentBox">
            <div class="qr-wrapper">
                <img id="qrcodeImg" alt="QR Code Pix" width="130" height="130">
            </div>

            <div class="pix-code-container">
                <span class="pix-code-label">Código Pix Copia e Cola:</span>
                <input type="text" class="pix-code-input" id="pixCode" readonly>
                <button class="btn-copy" id="btnCopy" onclick="copiarPix()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copiar Código Pix
                </button>
            </div>

            <p class="instructions">
                Abra o app do seu banco e selecione <strong>Pix Copia e Cola</strong> ou escaneie o QR Code.
            </p>
        </div>
    </div>

    <script>
        const codigosPix = {
            'ate149': '00020126580014br.gov.bcb.pix0136bbed7982-d54d-4e10-8e92-80533aa1e8795204000053039865802BR5925LARISSA MENDES APOLINARIO6005BELEM62070503***630430BA',
            '150mais': '00020126580014br.gov.bcb.pix013694af25d0-715b-4878-b895-0b8d7c679d375204000053039865802BR5925MAYCON WESLEY NUNES DE LI6005BELEM62070503***630463F8',
            'outrosServidores': '00020126580014br.gov.bcb.pix0136bbed7982-d54d-4e10-8e92-80533aa1e8795204000053039865802BR5925LARISSA MENDES APOLINARIO6005BELEM62070503***630430BA'
        };

        function selecionarFaixa(tipo, elemento) {
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');

            const codigo = codigosPix[tipo];
            const paymentBox = document.getElementById('paymentBox');
            const pixInput = document.getElementById('pixCode');
            const qrImg = document.getElementById('qrcodeImg');

            pixInput.value = codigo;

            // Usa a API oficial e estável do Google Chart para gerar o QR Code instantaneamente de forma nativa
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(codigo)}`;

            paymentBox.classList.add('active');

            const btnCopy = document.getElementById('btnCopy');
            btnCopy.classList.remove('copied');
            btnCopy.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copiar Código Pix`;
        }

        function copiarPix() {
            const pixInput = document.getElementById('pixCode');
            if (!pixInput.value) return;

            pixInput.select();
            pixInput.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(pixInput.value).then(() => {
                const btnCopy = document.getElementById('btnCopy');
                btnCopy.classList.add('copied');
                btnCopy.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Código Copiado!`;
                
                setTimeout(() => {
                    btnCopy.classList.remove('copied');
                    btnCopy.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copiar Código Pix`;
                }, 3000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        }
    </script>
</body>
</html>
