<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPRAR CRÉDITOS - PIX</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px;
  background:linear-gradient(
    135deg,
    #16002f 0%,
    #3b0b75 42%,
    #062b82 100%
  );
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.card{
  width:min(420px,100%);
  background:rgba(10,8,35,.82);
  border:1px solid rgba(115,90,255,.65);
  border-radius:16px;
  padding:14px;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
}

h1{
  text-align:center;
  margin:0 0 2px;
  font-size:23px;
}

.subtitle{
  text-align:center;
  color:#d0c8e8;
  margin-bottom:9px;
  font-size:12px;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
  margin:7px 0;
}

.buttons button{
  min-height:50px;
  padding:7px 5px;
}

.buttons span{
  font-size:10px;
  font-weight:normal;
}

.buttons button.selected{
  outline:2px solid #fff;
  background:#444451;
}

button{
  border:0;
  border-radius:8px;
  padding:9px 6px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  background:rgba(35,30,75,.9);
  color:#fff;
  border:1px solid rgba(105,85,255,.55);
}

button:hover{
  filter:brightness(1.15);
}

.primary{
  width:100%;
  background:#fff;
  color:#111;
  margin-top:5px;
  padding:9px;
  font-size:13px;
}

.result{
  display:none;
  text-align:center;
  margin-top:10px;
}

#qrcode{
  background:#fff;
  padding:5px;
  border-radius:8px;
  width:max-content;
  max-width:100%;
  margin:0 auto 7px;
}

#qrcode canvas,
#qrcode img{
  width:160px !important;
  height:160px !important;
}

/* AVISO GRANDE */
.status{
  color:#fff;
  font-size:18px;
  font-weight:700;
  line-height:1.35;
  margin:6px 0 4px;
}

.highlight{
  color:#fff;
  font-size:18px;
  font-weight:700;
  line-height:1.35;
  margin:6px 0 4px;
}

.copy{
  width:100%;
  background:#29205d;
  margin-top:7px;
  padding:9px;
  font-size:12px;
}

.error{
  color:#ff7272;
  margin-top:7px;
  text-align:center;
  display:none;
  font-size:12px;
}

@media (max-width:480px){

  body{
    padding:4px;
    align-items:flex-start;
  }

  .card{
    padding:12px;
    border-radius:14px;
    margin:2px 0;
  }

  h1{
    font-size:21px;
  }

  .subtitle{
    margin-bottom:7px;
    font-size:11px;
  }

  .buttons{
    gap:4px;
    margin:6px 0;
  }

  .buttons button{
    min-height:47px;
    padding:6px 4px;
    font-size:12px;
    border-radius:7px;
  }

  .buttons span{
    font-size:9px;
  }

  .primary{
    padding:9px;
    font-size:12px;
    border-radius:7px;
  }

  .result{
    margin-top:8px;
  }

  #qrcode{
    padding:4px;
    margin-bottom:6px;
  }

  #qrcode canvas,
  #qrcode img{
    width:150px !important;
    height:150px !important;
  }

  /* AVISO GRANDE NO CELULAR */
  .status{
    font-size:17px;
    font-weight:700;
    line-height:1.35;
    margin:5px 0 4px;
  }

  .highlight{
    font-size:17px;
    font-weight:700;
    line-height:1.35;
    margin:5px 0 4px;
  }

  .copy{
    padding:8px;
    font-size:11px;
    border-radius:7px;
  }

  .error{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="card">

  <h1>COMPRAR CRÉDITOS</h1>

  <div class="subtitle">
    Pagamento via PIX
  </div>

  <div class="buttons">

    <button onclick="selecionarFaixa('baixo')">
      P2CINE<br>
      <span>ATÉ R$ 149,00</span>
    </button>

    <button onclick="selecionarFaixa('alto')">
      P2CINE<br>
      <span>R$ 150,00 OU MAIS</span>
    </button>

    <button onclick="selecionarFaixa('gf')">
      GF (CLYCK)<br>
      <span>QUALQUER VALOR</span>
    </button>

    <button onclick="selecionarFaixa('pulse')">
      PULSE<br>
      <span>QUALQUER VALOR</span>
    </button>

    <button onclick="selecionarFaixa('imperial')">
      IMPERIAL<br>
      <span>QUALQUER VALOR</span>
    </button>

    <button onclick="selecionarFaixa('outros')">
      OUTROS SERVIDORES<br>
      <span>QUALQUER VALOR</span>
    </button>

  </div>

  <button class="primary" onclick="gerarPix()">
    GERAR QR CODE PIX
  </button>

  <div class="error" id="erro"></div>

  <div class="result" id="resultado">

    <div id="qrcode"></div>

    <div class="status highlight">
      Informe o valor diretamente no aplicativo do seu banco.
    </div>

    <button class="copy" onclick="copiarPix()">
      COPIAR PIX E COLAR
    </button>

  </div>

</div>

<script>

const PIX_CONFIGS = [

  {
    max:149.00,
    key:"bbed7982-d54d-4e10-8e92-80533aa1e879",
    name:"LARISSA MENDES APOLINARIO"
  },

  {
    min:150.00,
    key:"94af25d0-715b-4878-b895-0b8d7c679d37",
    name:"MAYCON WESLEY NUNES DE LIMA"
  }

];

const MERCHANT_CITY = "BELEM";

let faixaSelecionada = null;


function selecionarFaixa(faixa){

  faixaSelecionada = faixa;

  document
    .querySelectorAll(".buttons button")
    .forEach(btn => btn.classList.remove("selected"));

  const botoes =
    document.querySelectorAll(".buttons button");

  const mapa = {
    baixo:0,
    alto:1,
    gf:2,
    pulse:3,
    imperial:4,
    outros:5
  };

  if(botoes[mapa[faixa]]){

    botoes[mapa[faixa]]
      .classList.add("selected");

  }

}


function tlv(id,value){

  return id +
    String(value.length).padStart(2,"0") +
    value;

}


function crc16(payload){

  let crc = 0xFFFF;

  for(let i=0;i<payload.length;i++){

    crc ^= payload.charCodeAt(i) << 8;

    for(let j=0;j<8;j++){

      crc =
        (crc & 0x8000)
        ? ((crc << 1) ^ 0x1021) & 0xFFFF
        : (crc << 1) & 0xFFFF;

    }

  }

  return crc
    .toString(16)
    .toUpperCase()
    .padStart(4,"0");

}


function gerarPix(){

  const erro =
    document.getElementById("erro");

  const resultado =
    document.getElementById("resultado");

  erro.style.display="none";


  if(!faixaSelecionada){

    erro.textContent =
      "Selecione uma opção acima.";

    erro.style.display="block";

    resultado.style.display="none";

    return;

  }


  const config =
    faixaSelecionada === "alto"
      ? PIX_CONFIGS[1]
      : PIX_CONFIGS[0];


  const pix =
    criarPixSemValor(config);


  const box =
    document.getElementById("qrcode");

  box.innerHTML="";


  new QRCode(box,{

    text:pix,

    width:230,

    height:230,

    correctLevel:
      QRCode.CorrectLevel.M

  });


  document
    .querySelector(".status")
    .textContent =
      "Informe o valor diretamente no aplicativo do seu banco.";


  window.pixAtual = pix;

  resultado.style.display="block";

}


function criarPixSemValor(config){

  const merchantAccount =

    tlv(
      "00",
      "br.gov.bcb.pix"
    )

    +

    tlv(
      "01",
      config.key
    );


  let payload =

    tlv("00","01")

    +

    tlv(
      "26",
      merchantAccount
    )

    +

    tlv(
      "52",
      "0000"
    )

    +

    tlv(
      "53",
      "986"
    )

    +

    tlv(
      "58",
      "BR"
    )

    +

    tlv(
      "59",
      config.name.substring(0,25)
    )

    +

    tlv(
      "60",
      MERCHANT_CITY.substring(0,15)
    )

    +

    tlv(
      "62",
      tlv("05","P2CINE")
    )

    +

    "6304";


  return payload + crc16(payload);

}


async function copiarPix(){

  if(!window.pixAtual){
    return;
  }


  try{

    await navigator.clipboard
      .writeText(window.pixAtual);

    alert(
      "PIX Copia e Cola copiado!"
    );

  }catch(e){

    prompt(
      "Copie o PIX Copia e Cola:",
      window.pixAtual
    );

  }

}

</script>

</body>
</html>
