<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPRAR CRÉDITOS - PIX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(91,63,170,.28),transparent 34%),radial-gradient(circle at 85% 20%,rgba(0,155,255,.18),transparent 32%),linear-gradient(145deg,#070916 0%,#10132a 48%,#160d2b 100%);color:#fff;font-family:Arial,sans-serif}
.card{
  width:min(420px,100%);background:rgba(10,8,35,.82);
  border:1px solid rgba(115,90,255,.65);border-radius:16px;padding:12px;
  box-shadow:0 12px 35px rgba(0,0,0,.45);backdrop-filter:blur(8px);
}
h1{text-align:center;margin:0 0 1px;font-size:23px}
.subtitle{text-align:center;color:#d0c8e8;margin-bottom:7px;font-size:12px}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin:6px 0}
.buttons button{min-height:47px;padding:4px}
button{
  border:0;border-radius:7px;padding:8px 6px;font-size:12px;font-weight:bold;
  cursor:pointer;background:rgba(35,30,75,.9);color:#fff;
  border:1px solid rgba(105,85,255,.55);
}
button:hover{filter:brightness(1.15)}
.buttons button.selected{outline:2px solid #fff;background:#444451}
.buttons span{display:block;font-size:9px;font-weight:normal;margin-top:1px}
.logo-p2{display:block;width:125px;height:27px;object-fit:contain;margin:0 auto}
.logo-imperial{display:block;width:125px;height:27px;object-fit:contain;margin:0 auto}.logo-pulse{display:block;width:65px;height:24px;object-fit:contain;margin:0 auto}

.logo-clyck{
  display:block;
  width:95px !important;
  height:38px !important;
  object-fit:contain;
  margin:0 auto;
}

.primary{width:100%;background:linear-gradient(135deg,#7c3aed 0%,#2563eb 100%);color:#fff;margin-top:10px;padding:11px 12px;font-size:12px;font-weight:800;letter-spacing:.2px;border:1px solid rgba(255,255,255,.28);border-radius:8px;box-shadow:0 5px 14px rgba(37,99,235,.25),inset 0 1px 0 rgba(255,255,255,.18);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}.primary:hover{filter:brightness(1.08);box-shadow:0 7px 18px rgba(37,99,235,.34),inset 0 1px 0 rgba(255,255,255,.2);transform:translateY(-1px)}.primary:active{transform:translateY(0);box-shadow:0 3px 9px rgba(37,99,235,.25)}
.result{display:none;text-align:center;margin-top:8px}
#qrcode{background:#fff;padding:4px;border-radius:7px;width:max-content;max-width:100%;margin:0 auto 5px}
#qrcode canvas,#qrcode img{width:145px!important;height:145px!important}
.highlight{color:#fff;font-size:17px;font-weight:700;line-height:1.3;margin:5px 0}
.copy{width:100%;background:#29205d;margin-top:5px;padding:8px;font-size:11px}
.error{color:#ff7272;margin-top:6px;text-align:center;display:none;font-size:12px}

@media(max-width:480px){
  body{padding:3px;align-items:flex-start}
  .card{padding:11px;border-radius:14px;margin:2px 0}
  h1{font-size:21px}
  .subtitle{margin-bottom:6px;font-size:11px}
  .buttons{gap:4px;margin:5px 0}
  .buttons button{min-height:45px;padding:4px;font-size:12px;border-radius:7px}
  .logo-p2,.logo-imperial{width:120px;height:24px}.logo-pulse{width:65px;height:24px}
  .buttons span{font-size:9px}

  .logo-clyck{
    width:90px !important;
    height:36px !important;
  }

  .primary{padding:10px 11px;font-size:12px;border-radius:7px;margin-top:9px}
  .result{margin-top:7px}
  #qrcode{padding:4px;margin-bottom:5px}
  #qrcode canvas,#qrcode img{width:145px!important;height:145px!important}
  .highlight{font-size:17px;line-height:1.3;margin:5px 0}
  .copy{padding:8px;font-size:11px;border-radius:7px}
}

/* VISUAL PROFISSIONAL */
body{
  background:
    radial-gradient(circle at 12% 8%, rgba(116,78,220,.24), transparent 34%),
    radial-gradient(circle at 88% 18%, rgba(0,183,255,.16), transparent 30%),
    linear-gradient(145deg,#070916 0%,#0d1022 48%,#170d2d 100%) !important;
}
.card,.container,.box,.panel{
  background:rgba(10,12,27,.78) !important;
  border-color:rgba(139,92,246,.34) !important;
  box-shadow:0 18px 50px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.025) inset !important;
}
.primary{
  background:linear-gradient(135deg,#7c3aed 0%,#5b21b6 48%,#2563eb 100%) !important;
  color:#fff !important;
  border:1px solid rgba(255,255,255,.16) !important;
  box-shadow:0 8px 24px rgba(91,33,182,.32) !important;
}
.primary:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}
h1,h2,h3{letter-spacing:.2px}
.subtitle,.subtitulo,.muted{color:#c4c7d8 !important}


/* AJUSTES PROFISSIONAIS PARA CELULAR */
@media (max-width:600px){
  body{
    padding:10px !important;
    min-height:100vh;
    overflow-x:hidden;
  }
  .card,.container,.box,.panel{
    width:100% !important;
    max-width:100% !important;
    box-sizing:border-box !important;
    margin-left:auto !important;
    margin-right:auto !important;
    padding:14px !important;
    border-radius:14px !important;
  }
  h1{
    font-size:22px !important;
    line-height:1.15 !important;
    margin:4px 0 5px !important;
  }
  h2{
    font-size:17px !important;
  }
  .subtitle,.subtitulo{
    font-size:13px !important;
    line-height:1.35 !important;
  }
  button{
    min-height:42px;
    font-size:13px !important;
  }
  .primary{
    min-height:42px !important;
    padding:9px 12px !important;
    border-radius:9px !important;
    font-size:12px !important;
    gap:6px !important;
  }
  .primary:hover{transform:none}
  .pix-icon{
    width:17px !important;
    height:17px !important;
    flex:0 0 17px !important;
  }
  input,select{
    width:100% !important;
    max-width:100% !important;
    box-sizing:border-box !important;
    min-height:40px !important;
    font-size:14px !important;
  }
  .grid,.columns,.row{
    gap:8px !important;
  }
  table{
    width:100% !important;
    font-size:12px !important;
  }
  td,th{
    padding:7px 5px !important;
  }
  img{
    max-width:100%;
  }
}

</style>
</head>

<script>
const PIX_CONFIGS = [
  {
    max:149.00,
    key:"bbed7982-d54d-4e10-8e92-80533aa1e879",
    name:"LARISSA MENDES APOLINARIO"
  },
  {
    min:150.00,
    key:"94af25d0-715b-4878-b895-0b8d7c679d37",
    name:"MAYCON WESLEY NUNES DE LIMA"
  }
];

const MERCHANT_CITY="BELEM";
let faixaSelecionada=null;

function selecionarFaixa(faixa){
  faixaSelecionada=faixa;
  document.querySelectorAll(".buttons button").forEach(btn=>btn.classList.remove("selected"));
  const botoes=document.querySelectorAll(".buttons button");
  const mapa={baixo:0,alto:1,gf:2,pulse:3,imperial:4,outros:5};
  if(botoes[mapa[faixa]]) botoes[mapa[faixa]].classList.add("selected");
}

function tlv(id,value){
  return id+String(value.length).padStart(2,"0")+value;
}

function crc16(payload){
  let crc=0xFFFF;
  for(let i=0;i<payload.length;i++){
    crc^=payload.charCodeAt(i)<<8;
    for(let j=0;j<8;j++){
      crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,"0");
}

function gerarPix(){
  const erro=document.getElementById("erro");
  const resultado=document.getElementById("resultado");
  erro.style.display="none";

  if(!faixaSelecionada){
    erro.textContent="Selecione uma opção acima.";
    erro.style.display="block";
    resultado.style.display="none";
    return;
  }

  const config=faixaSelecionada==="alto"?PIX_CONFIGS[1]:PIX_CONFIGS[0];
  const pix=criarPixSemValor(config);
  const box=document.getElementById("qrcode");
  box.innerHTML="";

  new QRCode(box,{
    text:pix,width:145,height:145,correctLevel:QRCode.CorrectLevel.M
  });

  window.pixAtual=pix;
  resultado.style.display="block";
}

function criarPixSemValor(config){
  const merchantAccount=tlv("00","br.gov.bcb.pix")+tlv("01",config.key);
  let payload=
    tlv("00","01")+
    tlv("26",merchantAccount)+
    tlv("52","0000")+
    tlv("53","986")+
    tlv("58","BR")+
    tlv("59",config.name.substring(0,25))+
    tlv("60",MERCHANT_CITY.substring(0,15))+
    tlv("62",tlv("05","P2CINE"))+
    "6304";
  return payload+crc16(payload);
}

async function copiarPix(){
  if(!window.pixAtual)return;
  try{
    await navigator.clipboard.writeText(window.pixAtual);
    alert("PIX Copia e Cola copiado!");
  }catch(e){
    prompt("Copie o PIX Copia e Cola:",window.pixAtual);
  }
}
</script>
